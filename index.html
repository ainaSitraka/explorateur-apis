<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorateur d'APIs publiques</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--text:#1a1d23;--muted:#5f6673;--border:#e2e5ea;
  --accent:#2f5bea;--accent-soft:#e8eefe;--ok:#1d7a46;--ok-soft:#e3f4ea;--warn:#9a5b00;--warn-soft:#fdf0dc;--no:#a12a2a;--no-soft:#fbe5e5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111318;--surface:#1a1d24;--text:#e6e8ec;--muted:#9aa1ad;--border:#2a2f39;
  --accent:#7c9bff;--accent-soft:#232c45;--ok:#5fd394;--ok-soft:#1a3326;--warn:#f0b35a;--warn-soft:#3a2c17;--no:#f08080;--no-soft:#3a1d1d;}}
:root[data-theme="dark"]{
  --bg:#111318;--surface:#1a1d24;--text:#e6e8ec;--muted:#9aa1ad;--border:#2a2f39;
  --accent:#7c9bff;--accent-soft:#232c45;--ok:#5fd394;--ok-soft:#1a3326;--warn:#f0b35a;--warn-soft:#3a2c17;--no:#f08080;--no-soft:#3a1d1d;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:1.6rem}
header p{margin:4px 0 0;color:var(--muted)}
header a{color:var(--accent)}
.layout{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:240px 1fr;gap:20px}
aside{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px}
aside button{display:flex;justify-content:space-between;width:100%;border:0;background:none;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit;text-align:left}
aside button:hover{background:var(--bg)}
aside button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
aside button span{color:var(--muted);font-size:.85em}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.controls input[type=search]{flex:1 1 260px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
select{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
label.chk{display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;user-select:none}
#catSelect{display:none}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:10px;gap:10px;flex-wrap:wrap}
.meta button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card a{color:var(--text);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.card a:hover{color:var(--accent);text-decoration:underline}
.card p{margin:0;color:var(--muted);font-size:.92em;flex:1}
.cat{font-size:.78em;color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75em;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.no{background:var(--no-soft);color:var(--no);border-color:transparent}
mark{background:var(--warn-soft);color:inherit;border-radius:2px}
#more{display:block;margin:20px auto;padding:10px 18px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;cursor:pointer;font:inherit}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:800px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  #catSelect{display:block;flex:1 1 100%}
}
</style>
</head>
<body>
<header>
  <h1>Explorateur d'APIs publiques</h1>
  <p><span id="total"></span> APIs gratuites ou publiques, issues de <a href="https://github.com/public-apis/public-apis" target="_blank" rel="noopener noreferrer">public-apis/public-apis</a>.</p>
</header>
<div class="layout">
  <aside id="cats" aria-label="Catégories"></aside>
  <main>
    <div class="controls">
      <input id="q" type="search" placeholder="Rechercher un nom, une description…" autofocus>
      <select id="catSelect" aria-label="Catégorie"></select>
      <select id="auth" aria-label="Authentification">
        <option value="">Toute authentification</option>
        <option value="none">Sans authentification</option>
        <option value="apiKey">apiKey</option>
        <option value="OAuth">OAuth</option>
        <option value="other">Autre (X-Mashape-Key, User-Agent)</option>
      </select>
      <label class="chk"><input type="checkbox" id="https"> HTTPS</label>
      <label class="chk"><input type="checkbox" id="cors"> CORS</label>
    </div>
    <div class="meta">
      <span id="count"></span>
      <span>
        <select id="sort" aria-label="Tri">
          <option value="cat">Tri : catégorie</option>
          <option value="name">Tri : nom A→Z</option>
        </select>
        <button id="reset">Réinitialiser</button>
      </span>
    </div>
    <div id="grid" class="grid"></div>
    <button id="more" hidden>Afficher plus</button>
  </main>
</div>
<script src="data.js"></script>
<script>
(function(){
  // data row: [name, url, description, auth, https, cors, category]
  var DATA = window.APIS || [];
  var PAGE = 60, shown = PAGE;
  var state = {q:'', cat:'', auth:'', https:false, cors:false, sort:'cat'};
  var $ = function(id){return document.getElementById(id);};

  try { var saved = JSON.parse(localStorage.getItem('apis-filters') || 'null'); if (saved) Object.assign(state, saved); } catch(e){}

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
  function hl(text, q){
    var t = esc(text); if (!q) return t;
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig');
    return t.replace(re,'<mark>$1</mark>');
  }
  function safeUrl(u){return /^https?:\/\//i.test(u) ? u : '#';}

  DATA.forEach(function(r){ r.search = norm(r[0] + ' ' + r[2] + ' ' + r[6]); });
  var counts = {};
  DATA.forEach(function(r){ counts[r[6]] = (counts[r[6]]||0) + 1; });
  var cats = Object.keys(counts).sort(function(a,b){return a.localeCompare(b);});
  $('total').textContent = DATA.length.toLocaleString('fr-FR');

  function buildCats(){
    var html = '<button data-cat=""' + (state.cat===''?' class="active"':'') + '>Toutes<span>' + DATA.length + '</span></button>';
    var opts = '<option value="">Toutes les catégories (' + DATA.length + ')</option>';
    cats.forEach(function(c){
      html += '<button data-cat="' + esc(c) + '"' + (state.cat===c?' class="active"':'') + '>' + esc(c) + '<span>' + counts[c] + '</span></button>';
      opts += '<option value="' + esc(c) + '"' + (state.cat===c?' selected':'') + '>' + esc(c) + ' (' + counts[c] + ')</option>';
    });
    $('cats').innerHTML = html; $('catSelect').innerHTML = opts;
  }

  function filtered(){
    var q = norm(state.q.trim());
    var out = DATA.filter(function(r){
      if (state.cat && r[6] !== state.cat) return false;
      if (state.auth === 'none' && r[3]) return false;
      if (state.auth === 'other' && (!r[3] || r[3]==='apiKey' || r[3]==='OAuth')) return false;
      if (state.auth && state.auth!=='none' && state.auth!=='other' && r[3] !== state.auth) return false;
      if (state.https && r[4] !== 'Yes') return false;
      if (state.cors && r[5] !== 'Yes') return false;
      if (q && r.search.indexOf(q) === -1) return false;
      return true;
    });
    if (state.sort === 'name') out = out.slice().sort(function(a,b){return a[0].localeCompare(b[0]);});
    return out;
  }

  function tag(label, val){
    if (!val) return '';
    var cls = val==='Yes' ? 'ok' : val==='No' ? 'no' : '';
    return '<span class="tag ' + cls + '">' + label + ' ' + (val==='Yes'?'✓':val==='No'?'✗':'?') + '</span>';
  }

  function render(){
    var list = filtered(), q = state.q.trim();
    $('count').textContent = list.length.toLocaleString('fr-FR') + ' API' + (list.length>1?'s':'') + ' trouvée' + (list.length>1?'s':'');
    if (!list.length){ $('grid').innerHTML = '<div class="empty">Aucune API ne correspond à ces filtres.</div>'; $('more').hidden = true; return; }
    $('grid').innerHTML = list.slice(0, shown).map(function(r){
      var auth = r[3] ? '<span class="tag warn">' + esc(r[3]) + '</span>' : '<span class="tag ok">Sans auth</span>';
      return '<article class="card">' +
        '<span class="cat">' + esc(r[6]) + '</span>' +
        '<a href="' + esc(safeUrl(r[1])) + '" target="_blank" rel="noopener noreferrer">' + hl(r[0], q) + '</a>' +
        '<p>' + hl(r[2], q) + '</p>' +
        '<div class="tags">' + auth + tag('HTTPS', r[4]) + tag('CORS', r[5]) + '</div>' +
      '</article>';
    }).join('');
    $('more').hidden = shown >= list.length;
    $('more').textContent = 'Afficher plus (' + (list.length - shown) + ' restantes)';
    try { localStorage.setItem('apis-filters', JSON.stringify(state)); } catch(e){}
  }

  function update(patch){ Object.assign(state, patch); shown = PAGE; buildCats(); render(); }

  $('q').value = state.q; $('auth').value = state.auth; $('https').checked = state.https; $('cors').checked = state.cors; $('sort').value = state.sort;
  var timer;
  $('q').addEventListener('input', function(e){ clearTimeout(timer); timer = setTimeout(function(){ update({q:e.target.value}); }, 120); });
  $('auth').addEventListener('change', function(e){ update({auth:e.target.value}); });
  $('https').addEventListener('change', function(e){ update({https:e.target.checked}); });
  $('cors').addEventListener('change', function(e){ update({cors:e.target.checked}); });
  $('sort').addEventListener('change', function(e){ update({sort:e.target.value}); });
  $('catSelect').addEventListener('change', function(e){ update({cat:e.target.value}); });
  $('cats').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) { update({cat:b.getAttribute('data-cat')}); window.scrollTo({top:0}); } });
  $('more').addEventListener('click', function(){ shown += PAGE * 2; render(); });
  $('reset').addEventListener('click', function(){
    $('q').value=''; $('auth').value=''; $('https').checked=false; $('cors').checked=false; $('sort').value='cat';
    update({q:'', cat:'', auth:'', https:false, cors:false, sort:'cat'});
  });

  buildCats(); render();
})();
</script>
</body>
</html>
